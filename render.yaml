services:
  - type: web
    name: payment-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: static_site
    name: payment-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
